server
{
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name sutelio.miniserver.fun;
    root /www/wwwroot/sutelio.miniserver.fun/current/public;
    index index.php;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 32m;

    include /www/server/panel/vhost/nginx/extension/sutelio.miniserver.fun/*.conf;

    #CERT-APPLY-CHECK--START
    # Required by aaPanel for ACME HTTP file validation.
    include /www/server/panel/vhost/nginx/well-known/sutelio.miniserver.fun.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate /www/server/panel/vhost/cert/sutelio.miniserver.fun/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sutelio.miniserver.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:SutelioSSL:10m;
    ssl_session_timeout 1d;
    error_page 497 https://$host$request_uri;
    #SSL-END

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:\.env|\.git|\.ht|artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|README(?:\.md)?) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(?:php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    include enable-php-85.conf;

    access_log /www/wwwlogs/sutelio.miniserver.fun.log;
    error_log /www/wwwlogs/sutelio.miniserver.fun.error.log warn;
}
